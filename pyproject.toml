[project]
name = "learning-to-rank-demo"
version = "0.1.0"
description = "Demo project for XGBoost, LightGBM, and allRank learning-to-rank workflows"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy>=1.24,<2.0",
    "scikit-learn>=1.3,<1.6",
    "scipy>=1.10,<1.13",
    "xgboost>=2.0,<3.0",
    "lightgbm>=4.3,<5.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ltr_demo"]
